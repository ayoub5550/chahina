plugins { id 'com.android.application' }
android {
    namespace 'dz.chahina.app'
    compileSdk 34
    defaultConfig {
        applicationId "dz.chahina.app"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("CHAHINA_KEYSTORE") ?: "chahina.jks")
            storePassword System.getenv("CHAHINA_STORE_PASS") ?: "chahina2026"
            keyAlias System.getenv("CHAHINA_KEY_ALIAS") ?: "chahina"
            keyPassword System.getenv("CHAHINA_KEY_PASS") ?: "chahina2026"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' }
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
